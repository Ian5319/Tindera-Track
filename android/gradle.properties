org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# All current Flutter/Firebase dependencies are AndroidX-compatible; disabling
# Jetifier avoids an unnecessary heap-heavy transform of Flutter engine jars.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Avoid Kotlin daemon connection failures on Windows; compile in the Gradle
# process so a fresh APK can be produced reliably.
kotlin.compiler.execution.strategy=in-process
